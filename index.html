<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video de evidencia</title>
    <style>
        body {
            margin: 0;
            padding: 30px 15px;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        video {
            width: 100%;
            height: auto;
            max-height: 75vh;
            background: black;
        }

        h1 {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Video de evidencia</h1>

        <video controls playsinline preload="metadata">
            <source src="BONO.mp4" type="video/mp4">
            Tu navegador no puede reproducir este video.
        </video>
    </main>
</body>
</html>
